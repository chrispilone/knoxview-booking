[build]
  publish = "."

# app.js carries the Google Maps browser key (public by design, locked to our sites); don't fail builds on it
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "app.js"

# Download pages' own domain: its home page goes to the portal (the /d/<token> pages are served below like everywhere else)
[[redirects]]
  from = "https://downloadbeta.knoxview.com/"
  to = "https://bookbeta.knoxview.com/"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always fetch the latest app code (phones and home-screen apps otherwise keep old copies)
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Property websites (listing.knoxview.com): photos come from the Supabase media function, resized by Netlify Image CDN
[images]
  remote_images = ['https://sqlkswwwpkzadrrbhqip\.supabase\.co/functions/v1/media.*', 'https://sqlkswwwpkzadrrbhqip\.supabase\.co/storage/v1/object/public/.*']
